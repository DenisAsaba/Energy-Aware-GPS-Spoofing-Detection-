# M9 Stage 1 only. Final-test seeds are declared but never opened by this workflow.
simulation: {step_length_s: 1.0, begin_s: 0, end_s: 600}
gps: {noise_std_m_per_axis: 3.0, seed_offset: 78000, noise_model: independent_zero_mean_gaussian_per_axis}
detector:
  rolling_speed_window: 4
  normal_fpr_target: 0.05
  m8_persistence: {trigger_count: 2, trigger_window: 5, clear_after_clean_fixes: 3}
  staged_association_window_eligible_observations: 2
  staged_clear_after_joint_clean_observations: 3
  m5_thresholds:
    max_speed_mps: 21.143275132946187
    max_speed_change_mps: 17.433801896153664
    max_heading_change_deg: 170.59814632079238
  m8_thresholds:
    max_speed_mps: 21.143275132946187
    max_speed_change_mps: 17.433801896153664
    max_heading_change_deg: 170.59814632079238
    max_abs_acceleration_mps2: 17.433801896153664
    max_speed_consistency_mps: 6.833179913102611
splits:
  calibration: [2301, 2302, 2303, 2304, 2305, 2306]
  validation: [2401, 2402, 2403, 2404, 2405, 2406]
  final_test: [2501, 2502, 2503, 2504, 2505, 2506]
scenarios: [urban_turns_light, urban_stop_restart, urban_brake_accel]
attacks:
