      magnitudes_m: [30.0, 60.0]
      durations_s: [10, 25]
      direction_deg: 90.0
    jump:
      magnitudes_m: [30.0, 60.0]
      durations_s: [1, 5]
      direction_deg: 45.0
    drift:
      rates_mps: [0.5, 1.0]
      durations_s: [10, 25]
      direction_deg: 0.0
      max_displacement_m: 20.0
historical_analysis:
